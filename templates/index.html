<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyTutor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #contenedor {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: #181825;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        #cabecera {
            background: #313244;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #cabecera h1 {
            font-size: 1.2rem;
            color: #a6e3a1;
        }

        #cabecera span {
            font-size: 0.8rem;
            color: #6c7086;
        }

        #mensajes {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .burbuja {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .usuario {
            background: #45475a;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: #313244;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .pensando {
            background: #313244;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #6c7086;
            font-style: italic;
        }

        code {
            background: #1e1e2e;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #a6e3a1;
        }

        #formulario {
            padding: 16px 24px;
            background: #313244;
            display: flex;
            gap: 12px;
        }

        #input {
            flex: 1;
            background: #45475a;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            color: #cdd6f4;
            font-size: 0.95rem;
            outline: none;
        }

        #input:focus {
            background: #585b70;
        }

        #input::placeholder {
            color: #6c7086;
        }

        button {
            background: #a6e3a1;
            color: #1e1e2e;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        button:hover { background: #94e2d5; }
        button:disabled { background: #45475a; color: #6c7086; cursor: not-allowed; }

        #btnLimpiar {
            background: #45475a;
            color: #cdd6f4;
        }

        #btnLimpiar:hover { background: #585b70; }

        #mensajes::-webkit-scrollbar { width: 6px; }
        #mensajes::-webkit-scrollbar-track { background: transparent; }
        #mensajes::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="contenedor">
        <div id="cabecera">
            <span style="font-size:1.5rem">🐍</span>
            <div>
                <h1>PyTutor</h1>
                <span>Asistente de Python en local · qwen2.5-coder:3b</span>
            </div>
        </div>

        <div id="mensajes">
            <div class="burbuja bot">¡Hola! Soy PyTutor 🐍 Estoy aquí para ayudarte con tus dudas de Python. ¿Qué quieres aprender hoy?</div>
        </div>

        <div id="formulario">
            <input type="text" id="input" placeholder="Escribe tu pregunta sobre Python..." autocomplete="off"/>
            <button id="btnLimpiar" onclick="limpiar()">🗑 Limpiar</button>
            <button id="btnEnviar" onclick="enviar()">Enviar ➤</button>
        </div>
    </div>

    <script>
        const mensajes = document.getElementById("mensajes");
        const input = document.getElementById("input");
        const btnEnviar = document.getElementById("btnEnviar");

        input.addEventListener("keydown", e => {
            if (e.key === "Enter") enviar();
        });

        function agregarMensaje(texto, tipo) {
            const div = document.createElement("div");
            div.className = `burbuja ${tipo}`;
            div.textContent = texto;
            mensajes.appendChild(div);
            mensajes.scrollTop = mensajes.scrollHeight;
            return div;
        }

        async function enviar() {
            const texto = input.value.trim();
            if (!texto) return;

            agregarMensaje(texto, "usuario");
            input.value = "";
            btnEnviar.disabled = true;

            const pensando = agregarMensaje("PyTutor está pensando...", "pensando");

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({mensaje: texto})
                });
                const data = await res.json();
                pensando.remove();
                agregarMensaje(data.respuesta, "bot");
            } catch {
                pensando.remove();
                agregarMensaje("Error conectando con el servidor.", "bot");
            }

            btnEnviar.disabled = false;
            input.focus();
        }

        async function limpiar() {
            await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({mensaje: "limpiar"})
            });
            mensajes.innerHTML = "";
            agregarMensaje("Historial borrado. ¿En qué te ayudo? 🐍", "bot");
        }
    </script>
</body>
</html>
